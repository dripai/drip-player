name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
          - name: macOS Apple Silicon
            runner: macos-26
          - name: macOS Intel
            runner: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          standalone: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore bundled media tools
        uses: actions/cache@v4
        with:
          path: |
            .tool-cache
            lib
          key: media-tools-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ hashFiles('scripts/download-tools.mjs') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload draft release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Shadow Player ${{ github.ref_name }}"
          releaseBody: |
            Automated release for Shadow Player ${{ github.ref_name }}.
          releaseDraft: true
          prerelease: false

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Verify updater metadata
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir release-metadata
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          metadata = json.loads(Path("release-metadata/latest.json").read_text(encoding="utf-8"))
          if metadata["version"] != tag.removeprefix("v"):
              raise ValueError("Updater version does not match the release tag")
          prefix = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"
          for platform in ("windows-x86_64", "darwin-aarch64", "darwin-x86_64"):
              entry = metadata["platforms"][platform]
              if not entry["signature"].strip() or not entry["url"].startswith(prefix):
                  raise ValueError(f"Invalid updater metadata for {platform}")
          PY

      - name: Publish completed release
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest --verify-tag
