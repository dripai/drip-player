[package]
name = "shadow-player"
version = "1.0.5"
description = "A Tauri desktop media player with probe-first local and online playback."
authors = ["Shadow Player contributors"]
license = "MIT"
repository = "git@github.com:dripai/drip-player.git"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-process = "=2.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "fallible_uint"] }
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "stream", "system-proxy", "json"] }
url = "2.5.8"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
tempfile = "3.27.0"
dunce = "=1.0.5"
uuid = { version = "1.26.1", features = ["v4"] }
warp = { version = "0.4.3", features = ["server"] }
tauri-plugin-updater = "=2.11.0"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
subtp = "0.2.0"
sha2 = "0.10.9"
base64 = "0.22.1"
hmac = "0.12.1"
httpdate = "1.0.3"
futures-util = { version = "0.3.34", features = ["sink"] }
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
roxmltree = "0.21.1"
process-wrap = { version = "=10.0.0", default-features = false, features = ["tokio1", "creation-flags", "job-object", "process-group", "kill-on-drop"] }
fslock = "=0.2.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
warp = { version = "0.4.3", features = ["test"] }
